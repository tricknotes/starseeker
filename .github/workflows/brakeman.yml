name: Reviewdog

on: [pull_request]

jobs:
  brakeman:
    name: brakeman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.335.0
        with:
          ruby-version: 4.0.9
      - uses: reviewdog/action-brakeman@v2.20.0
        with:
          reporter: github-pr-review # Default is github-pr-check
