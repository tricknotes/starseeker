name: Image

# Pushes only what passed the specs.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest

    # The branches filter matches a pull request from a fork's main as well,
    # so only a push to this repository's main goes on to publish.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          # github.sha is main's tip when this runs, not the commit Build
          # tested; take the sha from the checkout instead.
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.production
          # supercronic is downloaded for amd64 only.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
