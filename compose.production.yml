# Production-like stack, for a host that runs Compose apps (for example
# koroku). compose.yml is the development setup.
#
# Required environment variables (set them in the host's app settings):
#   SECRET_KEY_BASE    bin/rails secret
#   POSTGRES_PASSWORD  password of the bundled PostgreSQL
#   BASE_URL           public URL, for example https://starseeker.example.com
#   GITHUB_CLIENT_ID, GITHUB_SECRET          GitHub OAuth app (login)
#   GITHUB_LOGIN, GITHUB_TOKEN               API access for fetching stars
# Optional: SENTRY_DSN, SENDGRID_USERNAME, SENDGRID_PASSWORD
#
# The web service listens on port 3000 and answers /up (any host) once the
# database is migrated. TLS is terminated by the reverse proxy in front of it.
# The scheduler service runs the recurring tasks in config/crontab.
#
# On koroku: Compose file compose.production.yml, public service web on port
# 3000, health check path /up. Back up the database with the dump hook (service
# postgres, command: pg_dump -U postgres -Fc starseeker_production) and leave
# the postgres-data volume out of the file backup, since a running database
# is not consistent on disk.

x-rails: &rails
  # Built from Dockerfile.production and pushed by .github/workflows/image.yml
  # on every merge to main. Pulled on each deploy, since latest moves.
  image: ghcr.io/tricknotes/starseeker:latest
  pull_policy: always
  environment:
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/starseeker_production
    REDIS_URL: redis://redis:6379
    # Passed through as they are. Naming them here lets the host check that
    # the required ones are set before it deploys.
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
    BASE_URL: ${BASE_URL:?set BASE_URL}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID}
    GITHUB_SECRET: ${GITHUB_SECRET:?set GITHUB_SECRET}
    GITHUB_LOGIN: ${GITHUB_LOGIN:?set GITHUB_LOGIN}
    GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN}

services:
  postgres:
    image: postgres:17.10-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: valkey/valkey:9.1.2-alpine
    volumes:
      - redis-data:/data

  # Creates or migrates the database, then exits. web starts after it.
  migrate:
    <<: *rails
    command: ["bin/rails", "db:prepare"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *rails
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # Runs the recurring tasks (config/crontab). The host has no scheduler of
  # its own, so the schedule lives with the app.
  scheduler:
    <<: *rails
    command: ["supercronic", "config/crontab"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
